name: Go bindings cache validation

on:
  push:
    branches: [test/go-bindings-cache]

permissions: read-all

jobs:
  go-bindings:
    name: Go Bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          # The Go module has no external dependencies and links a fresh Rust library.
          cache: false
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build Rust library
        run: bash ./scripts/build-bindings-mvp.sh
      - name: Test Go wrapper
        working-directory: bindings/go
        run: go test ./...
      - name: Test Go dedup helpers
        run: ./scripts/test-bindings-dedup.sh go
